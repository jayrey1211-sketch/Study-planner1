<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 맞춤형 학생 공부계획기</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js (마크다운 랜더링용) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { background-color: #f8fafc; font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="p-4 md:p-8 text-slate-800">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- 헤더 -->
    <header class="text-center py-4 bg-white rounded-2xl shadow-sm border border-blue-100">
      <h1 class="text-2xl md:text-3xl font-bold text-blue-600">📘 AI 스마트 학습 플래너</h1>
      <p class="text-slate-500 text-sm mt-1">나만의 목표와 일정에 꼭 맞는 최적의 공부 계획을 세워보세요.</p>
    </header>

    <!-- [상단] 입력 폼 카드 -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-blue-100">
      <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2">
        <span class="w-2 h-5 bg-blue-500 rounded-full inline-block"></span> 학습 정보 입력
      </h2>
      <form id="planForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">현재 신분</label>
          <select id="status" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-400 focus:outline-none">
            <option value="중학생">중학생</option>
            <option value="고등학생" selected>고등학생</option>
            <option value="대학생">대학생 / 취준생</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">공부 목표</label>
          <input type="text" id="goal" placeholder="예: 중간고사 전과목 90점, 한국사 1급" value="기말고사 내신 대비" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-400 focus:outline-none" required>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">공부 기간</label>
          <input type="text" id="duration" placeholder="예: 4주간, 시험 D-30" value="3주간" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-400 focus:outline-none" required>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">학원 / 기타 고정 스케줄</label>
          <input type="text" id="academy" placeholder="예: 월/수/금 18:00~20:00 영어학원" value="화/목 18:00~20:00 수학학원" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-400 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">공부 과목</label>
          <input type="text" id="subjects" placeholder="예: 국어, 수학, 영어, 한국사" value="국어, 수학, 영어" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-400 focus:outline-none" required>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">공부 범위</label>
          <input type="text" id="scope" placeholder="예: 1~3단원, 교재 50~120p" value="1~4단원 전체" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-400 focus:outline-none" required>
        </div>

        <div class="md:col-span-3 text-right">
          <button type="submit" id="submitBtn" class="w-full md:w-auto px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md transition-all">
            ✨ AI 공부 계획 생성하기
          </button>
        </div>
      </form>
    </section>

    <!-- [하단] 출력 영역 (2분할) -->
    <div id="outputSection" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <!-- 하단 좌측: 타임테이블 -->
      <section class="bg-white p-6 rounded-2xl shadow-sm border border-blue-100 flex flex-col">
        <h2 class="text-lg font-bold text-blue-700 mb-4 flex items-center gap-2">
          📅 주간 타임테이블
        </h2>
        <div id="timetableContainer" class="space-y-3 overflow-y-auto max-h-[500px] pr-2">
          <!-- JS로 동적 생성됨 -->
        </div>
      </section>

      <!-- 하단 우측: 텍스트 설명 + 오른쪽 하단 수정 버튼 -->
      <section class="bg-white p-6 rounded-2xl shadow-sm border border-blue-100 flex flex-col justify-between relative min-h-[500px]">
        <div>
          <h2 class="text-lg font-bold text-blue-700 mb-4 flex items-center gap-2">
            💡 맞춤형 학습 전략 & 컨설팅
          </h2>
          <div id="descriptionContainer" class="prose max-w-none text-slate-700 text-sm leading-relaxed overflow-y-auto max-h-[400px] pr-2">
            <!-- JS로 마크다운 변환 랜더링됨 -->
          </div>
        </div>

        <!-- 오른쪽 하단 수정 버튼 -->
        <div class="pt-4 border-t border-slate-100 flex justify-end">
          <button id="editBtn" onclick="openEditModal()" class="px-5 py-2.5 bg-slate-100 hover:bg-blue-50 text-blue-600 font-medium rounded-xl border border-blue-200 transition-all flex items-center gap-1.5 shadow-sm">
            ✏️ 계획 수정 요청하기
          </button>
        </div>
      </section>
    </div>

  </div>

  <!-- 계획 수정 모달 -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-md w-full space-y-4">
      <h3 class="text-lg font-bold text-slate-800">✏️ 공부 계획 수정요청</h3>
      <p class="text-xs text-slate-500">원하시는 변경사항이나 수정 조건을 입력해주세요. (예: 주말 시간 비우기, 수학 시간 늘리기 등)</p>
      <textarea id="customRequest" rows="4" placeholder="예: 주말에는 수학 위주로 바꾸고 평일 저녁 공부시간을 1시간 줄여주세요." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-400 focus:outline-none text-sm"></textarea>
      <div class="flex justify-end gap-2">
        <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm hover:bg-slate-200">취소</button>
        <button onclick="submitEdit()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm hover:bg-blue-700">수정 반영하기</button>
      </div>
    </div>
  </div>

  <script>
    let lastPayload = {};

    document.getElementById('planForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetchPlan();
    });

    async function fetchPlan(customRequest = '') {
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '⌛ AI가 공부 계획을 작성 중...';

      lastPayload = {
        status: document.getElementById('status').value,
        goal: document.getElementById('goal').value,
        duration: document.getElementById('duration').value,
        academy: document.getElementById('academy').value,
        subjects: document.getElementById('subjects').value,
        scope: document.getElementById('scope').value,
        customRequest: customRequest
      };

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(lastPayload)
        });

        if (!response.ok) throw new Error('서버 응답 오류');

        const data = await response.json();
        renderPlan(data);
        document.getElementById('outputSection').classList.remove('hidden');
      } catch (err) {
        alert('계획 생성 중 오류가 발생했습니다: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '✨ AI 공부 계획 생성하기';
      }
    }

    function renderPlan(data) {
      // 1. 타임테이블 랜더링
      const ttContainer = document.getElementById('timetableContainer');
      ttContainer.innerHTML = '';
      
      data.timetable.forEach(item => {
        const dayCard = document.createElement('div');
        dayCard.className = 'p-3 bg-blue-50/60 rounded-xl border border-blue-100';
        
        let tasksHtml = item.tasks.map(t => `<li class="text-xs text-slate-700 mt-1 list-disc list-inside">${t}</li>`).join('');
        dayCard.innerHTML = `
          <div class="font-bold text-sm text-blue-800">${item.day}</div>
          <ul>${tasksHtml}</ul>
        `;
        ttContainer.appendChild(dayCard);
      });

      // 2. 텍스트 설명 랜더링 (마크다운)
      document.getElementById('descriptionContainer').innerHTML = marked.parse(data.description || '');
    }

    function openEditModal() {
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    async function submitEdit() {
      const reqText = document.getElementById('customRequest').value;
      closeEditModal();
      if (reqText.trim()) {
        await fetchPlan(reqText);
      }
    }
  </script>
</body>
</html>
